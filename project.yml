name: FFDashPrototype
options:
  bundleIdPrefix: com.royalenfield.ff
  deploymentTarget:
    iOS: "16.0"
targets:
  FFDashPrototype:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.royalenfield.ff.dashprototype
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
